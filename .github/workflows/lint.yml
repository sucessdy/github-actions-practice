
name: Auto Linter

on:
  push:
    paths:
      - '**/*.js'

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Check code quality
      - name: Run ESLint
        run: npx eslint src/ --max-warnings 0

      # Check formatting
      - name: Run Prettier
        run: npx prettier --check src/
