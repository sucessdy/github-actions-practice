#workflow 
name: Hello

 #on tells the workflow should runs 
on:
  workflow-dispatch: 
#Job tells what  the  workflow   should do , there can be one and more jobs , hence we write jobs and jobs is a object we need indentation 
#Steps are individual tasks executed inside a job.

jobs: 
  say-hello:
      runs-on: ubuntu-latest
      steps:  
        - name: say hello to everyone
          run : echo "hello world" 
